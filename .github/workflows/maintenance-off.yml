name: Maintenance mode OFF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance-off.yml']

jobs:
  off:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Restore normal .htaccess (backup kept as .htaccess.maintenance)
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          S="ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST"
          $S "cd '$REMOTE_DIR' && [ -f .htaccess ] && cp .htaccess .htaccess.maintenance || true"
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 public/.htaccess "$SSH_USER@$SSH_HOST:$REMOTE_DIR/.htaccess"
      - name: Check site
        run: |
          sleep 5
          for u in / /menu /assets/img/hero-banner-1600.webp; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://bretlyn.com$u)"
          done
