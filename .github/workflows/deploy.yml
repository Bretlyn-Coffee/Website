name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build (React + MUI)
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Keep a copy of the build (hidden ref, not a branch)
        run: |
          cd dist && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/builds/latest
          rm -rf .git
      - name: Upload build with rsync
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_PATH }}
        run: |
          # .htaccess and maintenance.html are managed by hand on the server
          # (e.g. maintenance mode), so never overwrite or delete them.
          rsync -avz --delete \
            --exclude='.htaccess*' --exclude='maintenance.html' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            ./dist/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

      - name: Smoke test
        run: |
          sleep 5
          # 503 is expected while the site is in maintenance mode
          curl -sSIL https://bretlyn.com | head -n 1
