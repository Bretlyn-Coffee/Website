name: Clean up extra branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git init -q tmp && cd tmp
          for b in mui-dev preview-build verify-output; do
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$b" || true
          done
