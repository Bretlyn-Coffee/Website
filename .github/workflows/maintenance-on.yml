name: Maintenance mode ON

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance-on.yml']

jobs:
  off:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Put back the maintenance .htaccess (saved as .htaccess.maintenance)
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts && break; sleep 5; done
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "cd '$REMOTE_DIR' && ls -la | grep -i 'htaccess\|maint' ; if [ -f .htaccess.maintenance ]; then cp .htaccess .htaccess.live && cp .htaccess.maintenance .htaccess && echo SWITCHED; else echo NO_BACKUP; fi"
      - name: Check site
        run: |
          sleep 5
          for u in / /menu /assets/img/hero-banner-1600.webp; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://bretlyn.com$u)"
          done
