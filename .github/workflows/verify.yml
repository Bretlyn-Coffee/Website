name: Verify live site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live pages
        run: |
          mkdir out && cd out
          for u in / /menu /about /about.html /favicon.svg /assets/img/hero-banner-2560.webp /assets/img/hero-banner-1600.jpg /assets/img/menu/iced-americano-800.webp /assets/img/menu/iced-americano-1400.jpg /assets/img/menu/coconut-latte-1400.webp; do
            echo "== $u" >> report.txt
            curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download}B\n" "https://bretlyn.com$u?nocache=$RANDOM" >> report.txt
          done
          curl -sSI "https://bretlyn.com/" > headers.txt; curl -sS "https://bretlyn.com/?x=$RANDOM" -o body503.html; curl -sSI "https://bretlyn.com/assets/img/menu/iced-americano-800.webp" > webp-headers.txt; curl -sSI "https://bretlyn.com/assets/img/menu/iced-americano-1400.jpg" > img-headers.txt; curl -sS -o iced-americano-1400.jpg "https://bretlyn.com/assets/img/menu/iced-americano-1400.jpg"; curl -sS -o hero-banner-1600.jpg "https://bretlyn.com/assets/img/hero-banner-1600.jpg"
          curl -sS "https://bretlyn.com/?nocache=$RANDOM" > home.html
          curl -sS -o hazelnut-live.jpg "https://bretlyn.com/assets/img/menu/hazelnut-latte-800.jpg?n=$RANDOM"; curl -sS -o hazelnut-live.webp "https://bretlyn.com/assets/img/menu/hazelnut-latte-800.webp?n=$RANDOM"
          for js in $(grep -o 'static/[^"]*\.js' home.html); do curl -sS "https://bretlyn.com/$js" >> bundle.js; done
          grep -o '__v_check\|?v=\${[^}]*}\|"[a-z0-9]\{8,9\}"' bundle.js | head -5 > bundle-ver.txt || true
          V=$(grep -o 'iced-americano' bundle.js | head -1); echo "bundle has menu: $V" >> report.txt
          curl -sS -o iced-americano-v.jpg "https://bretlyn.com/assets/img/menu/iced-americano-1400.jpg?v=check$RANDOM"
          md5sum iced-americano-1400.jpg iced-americano-v.jpg >> report.txt
          curl -sS "http://www.bretlyn.com/" -o /dev/null -w "www redirect: %{http_code} -> %{redirect_url}\n" >> report.txt
          echo | openssl s_client -servername bretlyn.com -connect bretlyn.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName > cert.txt || true
      - name: Show photo checksums
        run: cd out && md5sum hazelnut-live.* && file hazelnut-live.* && grep -o 'assets/index-[^"]*\.js' home.html
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: out
